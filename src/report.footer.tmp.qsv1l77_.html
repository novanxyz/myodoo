
        <!DOCTYPE html>
        <html style="height: 0;">
            <head>
                <base href="http://erp.novaarthama.com"/>
                <link type="text/css" rel="stylesheet" href="/web/assets/debug/web.report_assets_pdf.css" data-asset-bundle="web.report_assets_pdf" data-asset-version="29d519d"/>
                <link type="text/css" rel="stylesheet" href="/web/assets/debug/web.report_assets_common.css" data-asset-bundle="web.report_assets_common" data-asset-version="b291d0a"/>
                
                <meta charset="utf-8"/>
                <script>
                    function subst() {
                        var vars = {};
                        var x = document.location.search.substring(1).split('&');
                        for (var i in x) {
                            var z = x[i].split('=', 2);
                            vars[z[0]] = unescape(z[1]);
                        }
                        var x = ['sitepage', 'sitepages', 'section', 'subsection', 'subsubsection'];
                        var z = {'sitepage': 'page', 'sitepages': 'topage'};
                        for (var i in x) {
                            var y = document.getElementsByClassName(z[x[i]] || x[i])
                            for (var j=0; j<y.length; ++j)
                                y[j].textContent = vars[x[i]];
                        }

                        var index = vars['webpage'].split('.', 4)[3];
                        var header = document.getElementById('minimal_layout_report_headers');
                        if(header){
                            var companyHeader = header.children[index];
                            header.textContent = '';
                            header.appendChild(companyHeader);
                        }
                        var footer = document.getElementById('minimal_layout_report_footers');
                        if(footer){
                            var companyFooter = footer.children[index];
                            footer.textContent = '';
                            footer.appendChild(companyFooter);
                        }
                    }
                </script>
            </head>
            <body class="container" style="overflow:hidden" onload="subst()" dir="ltr">
                <div id="minimal_layout_report_footers"><div style="font-size:smaller" class="footer o_standard_footer o_company_1_layout">
            </div>

        
            
                </div>
            </body>
        </html>
